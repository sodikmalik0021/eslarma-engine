name: clock
# Telegram + publishing at the slots. Any start (cron, end of a production run) does a tick; if a slot is near it stays until the slot.
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: clock
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      COMPOSIO_ACCOUNT: ${{ secrets.COMPOSIO_ACCOUNT }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: sodikmalik0021/eslarma-bot, ref: main, path: priv, ssh-key: "${{ secrets.DATA_KEY }}" }
      - run: bash run.sh setup && bash run.sh tick
      - name: Stay for the next slot when it is near
        run: |
          W=$(python3 - <<'EOF'
          import json, sys
          sys.path.insert(0, "tools"); import slots
          from datetime import datetime
          st = json.load(open("data/state.json")); now = datetime.now(slots.TZ); w = 0
          for x in st.get("slots") or slots.DEFAULT:
              h, m = map(int, x.split(":")); s = now.replace(hour=h, minute=m, second=5, microsecond=0); d = (s - now).total_seconds()
              if 0 < d <= 100 * 60: w = int(d)
          print(w)
          EOF
          )
          [ "$W" -gt 0 ] && { echo "waiting $W s"; sleep $W; bash run.sh tick; } || true
      - name: Keep the stock full
        run: |
          N=$(python3 -c "import json;q=json.load(open('data/queue.json'));c=lambda s:sum(i.get('status')==s for i in q);print(int(c('ready')+c('approved')+c('awaiting_approval')<6 and c('downloaded')>0))")
          [ "$N" = 1 ] && [ -z "$(gh run list -w produce.yml -L 6 --json status -q '.[]|select(.status!="completed").status')" ] && gh workflow run produce.yml || true
